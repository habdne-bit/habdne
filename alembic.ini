# TURAB — Alembic configuration.
#
# Ref: RFC-001 §14.2 (R14.4-R14.7).
#
# The frozen schema is the initial migration. Autogeneration is refused in
# db/migrations/env.py, not merely discouraged here: see the reasoning there.
#
# The URL is deliberately absent. It comes from TURAB_DATABASE_URL via env.py,
# so a migration cannot be run against a database nobody named.

[alembic]
script_location = db/migrations
prepend_sys_path = src
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
