[project]
name = "turab"
version = "0.1.0"
description = "TURAB — local real-estate platform. Modular monolith."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:turab.*"]
# xunit1: per-testcase <properties> are part of the format. The step-4
# attribution experiment records waited / wrote / final per case with
# `record_property`, which the default xunit2 family does not define (pytest
# warns and writes them outside the schema).
junit_family = "xunit1"
