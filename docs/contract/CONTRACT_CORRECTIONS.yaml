# =============================================================================
# TURAB — numbered contract corrections
#
# Ref: RFC-001 R10.2, R14.1; FILE_AUTHORITY_AND_VERSION_POLICY.md.
#
# The frozen OpenAPI is vendored byte-for-byte and is NEVER edited in place.
# Where an approved decision makes an operation's declared roles wrong, the
# decision is recorded here and applied on top of the frozen contract when the
# policy table is built. The frozen file stays the published artifact; this
# file is the audited difference between it and what is enforced.
#
# Two invariants are enforced mechanically in src/turab/auth/contract.py and
# are the reason this file cannot become a back door:
#
#   1. A correction may only NARROW. `corrected` must be a subset of `frozen`.
#      Widening access is a contract change and needs a new official handoff
#      package, not a local overlay.
#   2. `frozen` must equal what the frozen contract actually declares today.
#      If the published package changes, every correction that referred to the
#      old text fails loudly instead of silently applying to new text.
#
# Every entry names the decision that approved it. A correction without one is
# an opinion.
# =============================================================================

baseline: "0.2.3"

corrections:
  - id: CORRECTION-001
    decision: D7
    approved: "2026-09-19"
    operation_id: postParties
    field: x-roles
    frozen: [ADMIN, OPERATOR, CUSTOMER]
    corrected: [ADMIN, OPERATOR]
    rationale: >-
      POST /parties creates a market PARTY on behalf of someone, performed by
      staff. No general self-service creation is adopted through it, and
      CUSTOMER is not added to its permissions without a defined onboarding
      path. Self-service party creation is held as a separate Design Ledger
      item requiring its own contract before implementation.
    does_not_affect: >-
      A CUSTOMER creating their own REQUEST remains in scope for Slice 2,
      using an account already bound to the correct party. Restricting PARTY
      creation to staff does not remove that path.

# ---------------------------------------------------------------------------
# CORRECTION-002 records a WORKFLOW adoption, not a role change, so it carries
# no x-roles narrowing. It is listed here because the effective contract is
# where a reader looks to learn what is actually enforced.
# ---------------------------------------------------------------------------

workflow_adoptions:
  - id: CORRECTION-002
    decision: "Slice 2 closing round, 2026-09-19"
    approved: "2026-09-19"
    operation_id: postRequestsRequestIdState
    summary: >-
      ACTIVE -> PAUSED and ACTIVE -> CLOSED are adopted as direct transitions:
      a request is not required to pass through NEEDS_CONFIRMATION in order to
      be paused or closed. Reactivation from PAUSED or CLOSED is the state
      command itself with target_status=ACTIVE; no additional field is used or
      accepted. Closing requires a reason_code from the REQUEST_CLOSURE
      category added by migration 0002_request_closure_reasons, and
      REQUEST_CLOSED_OTHER requires a note.
    reference: docs/gate/REQUEST_STATE_TRANSITIONS.md

# ---------------------------------------------------------------------------
# Request-body narrowings. A listed field becomes REQUIRED: strictly fewer
# requests are accepted, so this narrows. Each such field's `default` is
# removed, because a default applies only when the field is omitted, and
# omission is now refused. The removed defaults are pinned in
# `frozen_defaults` and checked against the package, exactly as `frozen`
# roles are. Validated by `turab.auth.contract.load_request_body_narrowings`,
# which also refuses any key that is not a narrowing.
# ---------------------------------------------------------------------------

request_body_narrowings:
  - id: CORRECTION-004
    decision: "G4-1, Slice 4 plan revision 2 (docs/gate/SLICE_4_PLAN.md), approved for step 1"
    approved: "2026-09-26"
    operation_id: postRequestsRequestIdMatchingRun
    require: [matching_policy_version]
    frozen_defaults:
      matching_policy_version: "0.1.0"
    rationale: >-
      The frozen package defaults matching_policy_version to 0.1.0, but the
      frozen master seed creates only policy 0.2.0, which is the active one.
      A run that omitted the field would name a policy that does not exist
      (measured: docs/gate/evidence/SLICE4-PLAN-MEASUREMENTS.txt, section A).
      Requiring the field removes the default that can never apply.
    runtime_rule: >-
      The value must equal the version of the ACTIVE matching policy
      (ux_matching_policy_one_active). Any other value, a version of an
      inactive policy included, is refused with a typed 422 that does not echo
      the value, and nothing is written. Enforced by the matching run route,
      Slice 4 step 7; that route does not exist yet.
    reference: docs/contract/CORRECTION-004-matching-policy-version.md
  - id: CORRECTION-005
    decision: "G6-8 (ii) (a), Slice 6 plan revision 3 (docs/gate/SLICE_6_PLAN.md), approved in the review of bd54216"
    approved: "2026-10-17"
    operation_id: postTasksTaskIdComplete
    require: [outcome_code]
    non_null: [outcome_code]
    enum:
      outcome_code: [TASK_INFORMATION_OBTAINED, TASK_INFORMATION_UNAVAILABLE,
                     TASK_PARTY_UNREACHABLE, TASK_NO_LONGER_NEEDED]
    frozen_defaults: {}
    rationale: >-
      A completion states its outcome, from the codes of category
      TASK_OUTCOME (migration 0007, part B). The general seeded codes are
      accepted by the FK but describe no task outcome (measured,
      SLICE6-PLAN-MEASUREMENTS.txt §E3).
    runtime_rule: >-
      outcome_code is required, not null, and one of the four codes. A code
      changes no fact and raises no verification level.
    reference: docs/contract/CORRECTION-005-task-outcome-code.md
  - id: CORRECTION-006
    decision: >-
      G7-7 (a), Slice 7 plan (docs/gate/SLICE_7_PLAN.md): direction approved in
      the review of 4aed49b; the method (written in step 2, its text reviewed
      with step 2's delivery) approved in the review of 0f423d2. The TEXT of
      this entry is submitted for approval with that delivery, and is not yet
      approved.
    operation_id: postCommunicationThreads
    require: [party_id]
    non_null: [party_id]
    frozen_defaults: {}
    rationale: >-
      A thread is "linked to the relevant PARTY" (API_CONTRACTS_v0.2.md
      §4.12). A thread without a party can never carry a COMMUNICATION_ARCHIVE
      consent: the frozen binding trigger refuses it (measured, M5,
      SLICE7-PLAN-MEASUREMENTS.txt), so no content could ever be archived in it
      (G7-9).
    runtime_rule: >-
      party_id is required, not null, and names an existing party; otherwise
      the body is refused (422 VALIDATION_FAILED for the schema, 422
      LINKED_RECORD_NOT_FOUND for an unknown party), writing nothing. Its
      consistency with the other links is G7-6's.
    reference: docs/contract/CORRECTION-006-thread-party-required.md
