      summary: Start OTP challenge
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpStart'
      responses:
        '201':
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                required:
                - challenge_id
                - expires_at
                properties:
                  challenge_id: &id002
                    type: string
                    format: uuid
                  expires_at: &id003
                    type: string
                    format: date-time
        '400': &id001
          description: Request rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      operationId: postAuthOtpStart
