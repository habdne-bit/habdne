components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Required for mutating commands. Same key + same request hash must replay the original result; same key
        + different hash returns 409.
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Required optimistic concurrency version for mutable resource projection.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - trace_id
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        trace_id:
          type: string
        field_errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        has_next:
          type: boolean
    Location:
      type: object
      required:
      - location_id
      - code
      - canonical_ar
      - location_type
      properties:
        location_id: *id002
        code:
          type: string
        parent_id:
          anyOf:
          - *id002
          - type: 'null'
        canonical_ar:
          type: string
        canonical_fr:
          anyOf:
          - type: string
          - type: 'null'
        location_type:
          type: string
          enum:
          - WILAYA
          - COMMUNE
          - AREA
          - KSAR
          - NEIGHBORHOOD
          - LANDMARK
          - OTHER
        confidence_level:
          type: string
          enum:
          - CONFIRMED
          - CANDIDATE
          - UNMAPPED
        active_for_selection:
          type: boolean
        aliases:
          type: array
          items:
            type: string
    Party:
      type: object
      required:
      - party_id
      - kind
      - status
      properties:
        party_id: *id002
        kind:
          type: string
          enum:
          - PERSON
          - BUSINESS
        status:
          type: string
          enum:
          - DISCOVERED
          - CONTACTED
          - CONTACT_VERIFIED
          - PARTY_ACTIVE
          - INACTIVE
        display_name:
          anyOf:
          - type: string
          - type: 'null'
        legal_name:
          anyOf:
          - type: string
          - type: 'null'
        created_at: *id003
        updated_at: *id003
    PartyCreate:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - PERSON
          - BUSINESS
        display_name:
          type: string
        legal_name:
          type: string
        notes:
          type: string
      additionalProperties: false
    PhoneInput:
      type: object
      additionalProperties: false
      required:
      - phone_e164
      properties:
        phone_e164:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        is_primary:
          type: boolean
          default: false
        relationship_note:
          type:
          - string
          - 'null'
    ConsentGrantInput:
      type: object
      required:
      - scope
      - channel
      - consent_version
      - granted_at
      properties:
        scope:
          type: string
          enum:
          - ASSISTED_ENTRY
          - PUBLIC_LISTING_ALLOWED
          - PRIVATE_MATCHING_ONLY
