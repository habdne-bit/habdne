openapi: 3.1.0
info:
  title: TURAB API
  version: 0.2.0
  description: 'TURAB foundational API contract v0.2 — remediated after Technical Architecture Review.


    Core invariants:

    - REQUEST and PROPERTY are equal first-class entities.

    - PROPERTY != POST/SOURCE and PROPERTY != PROPERTY_OFFER.

    - Match evaluation is Request × canonical Property plus an explicit commercial context.

    - MATCH_CANDIDATE != OPPORTUNITY.

    - Matching inputs are snapshotted immutably and hashed.

    - Hard FAIL cannot be overridden by ranking; required UNKNOWN creates information work.

    - Opportunity requires latest human APPROVED review plus freshness, permission and information gates.

    - Consent is resource-scoped and revocable.

    - Customer/public DTOs are separate from internal DTOs.

    - AI never upgrades verification, changes user criteria silently, or creates Opportunity autonomously.

    '
servers:
- url: /api/v1
  description: Relative API base
tags:
- name: Auth
- name: Master Data
- name: Parties
- name: External Leads
