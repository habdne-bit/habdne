                  verification_result:
                    type: string
                    enum:
                    - PHONE_CONTROL_VERIFIED
                    - SESSION_CREATED
                  contact_point_id:
                    type: string
                    format: uuid
                  access_token:
                    type:
                    - string
                    - 'null'
                  account_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  party_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  roles:
                    type: array
                    items:
                      type: string
        '400': *id001
